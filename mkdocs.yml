site_name: pyside6-gui-template
site_description: Desktop GUI template built with PySide6 and Qt Designer.
site_url: https://cameronbrooks11.github.io/pyside6-gui-template/
repo_url: https://github.com/CameronBrooks11/pyside6-gui-template
repo_name: CameronBrooks11/pyside6-gui-template

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences

# The script that writes docs/images/ is not a page of the site.
exclude_docs: |
  screenshots.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Customising: customising.md
  - Credits: credits.md

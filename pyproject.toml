[project]
name = "pyside6-gui-template"
version = "0.1.0"
description = "Flat, frameless desktop GUI template built with PySide6 and Qt Designer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyside6>=6.7"]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1"]
docs = ["mkdocs-material>=9.5"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The modules pyside6-uic and pyside6-rcc write are regenerated, not edited.
# The patterns do not name the package, so they survive renaming it.
# .claude/ can hold files a coding agent's sandbox makes unreadable, which
# ruff would stop on.
extend-exclude = ["src/*/ui/ui_*.py", "src/*/ui/resources_rc.py", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/*/about.py" = ["E501"]  # paragraphs of placeholder text, one per line

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["src/*/ui/ui_*.py", "src/*/ui/resources_rc.py"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
